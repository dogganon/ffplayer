channels:
  - conda-forge

dependencies:
  # Native C++ / Python build
  - python>=3.11
  - cxx-compiler
  - cmake>=3.20
  - ninja
  - meson
  - make
  - pkg-config
  - ffmpeg=8.*
  - pybind11

  # Browser / WebAssembly build
  # 4.0.9 in conda-forge depends on Binaryen 117 but requires 123.
  - emscripten=3.1.58
  - nodejs

  # Building FFmpeg for Wasm
  - git
