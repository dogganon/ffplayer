name: Publish VS Code Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        uses: ./.github/actions/build

      - name: Publish VS Code extension
        shell: bash -el {0}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run vscode:publish
