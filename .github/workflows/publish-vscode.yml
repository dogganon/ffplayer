name: Publish VS Code Extension

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        uses: ./.github/actions/build

      - name: Upload vscode dist
        uses: actions/upload-artifact@v4
        with:
          name: vscode-dist
          path: app/vscode/dist/

  publish:
    name: Publish Alpha
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download vscode dist
        uses: actions/download-artifact@v4
        with:
          name: vscode-dist
          path: app/vscode/dist/

      - name: Publish pre-release
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run vscode:publish
